spring.application.name=pdfupdater

# Configure the port
server.port=8080

# Configure multipart upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Performance: Enable GZIP Compression for faster network transfer
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Performance: Maximize Tomcat Concurrency Threads for Parallel Processing
server.tomcat.threads.max=500
server.tomcat.threads.min-spare=20
server.tomcat.max-connections=10000

# Cloud Deployment: Actuator Health Checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Stability: Timeouts for heavy PDF processing (5 minutes)
spring.mvc.async.request-timeout=300000
server.tomcat.connection-timeout=300000

# Gemini API Key (fallback AI provider)
gemini.api.key=${GEMINI_API_KEY:your_gemini_api_key_here}

# Groq API Key (primary AI provider - fast + reliable)
# Get your free key at https://console.groq.com
groq.api.key=${GROQ_API_KEY:your_groq_api_key_here}

# AI Processing Configuration
ai.chunk.size=3500
ai.groq.model=mixtral-8x7b-32768
