spring.application.name=pdfupdater

# Configure the port
server.port=${PORT:8080}

# Configure multipart upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Performance: Enable GZIP Compression for faster network transfer
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Performance: Maximize Tomcat Concurrency Threads for Parallel Processing
server.tomcat.threads.max=500
server.tomcat.threads.min-spare=20
server.tomcat.max-connections=10000

# Cloud Deployment: Actuator Health Checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Stability: Timeouts for heavy PDF processing (5 minutes)
spring.mvc.async.request-timeout=300000
server.tomcat.connection-timeout=300000

# Gemini API Key (fallback AI provider)
gemini.api.key=${GEMINI_API_KEY:your_gemini_api_key_here}

# Groq API Key (primary AI provider - fast + reliable)
# Get your free key at https://console.groq.com
groq.api.key=${GROQ_API_KEY:your_groq_api_key_here}

# AI Processing Configuration
ai.chunk.size=3500
ai.groq.model=mixtral-8x7b-32768

# ========================================================
# DATABASE CONFIGURATION (Supabase / PostgreSQL)
# ========================================================
# URL should look like: jdbc:postgresql://aws-0-REGION.pooler.supabase.com:6543/postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?prepareThreshold=0}
spring.datasource.username=${DB_USERNAME:postgres.liquuswvwsrolthdyqmn}
spring.datasource.password=${DB_PASSWORD:s_7H*r#ZuDx3yFQ}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
# Automatically update the database schema based on our Java Entities (safe for dev/MVP)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Thymeleaf: disable caching so template edits take effect without restart
spring.thymeleaf.cache=false

# ========================================================
# EMAIL CONFIGURATION (SMTP)
# ========================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
